<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Support Specialist at Orbita (synthetic, a date field)</title>
<style>body{font-family:Arial,sans-serif;max-width:720px;margin:24px auto;padding:0 16px}label{display:block;margin:12px 0 4px;font-weight:600}input{width:100%;padding:8px;box-sizing:border-box}.lab{background:#fff3cd;padding:8px}</style>
</head>
<body>
<p class="lab">ATS Hero apply lab: a synthetic posting on localhost whose form asks for a date, which the agent doesn't set. Not a real employer.</p>
<h1>Support Specialist</h1>
<form id="date_form">
  <label for="name">Full name *</label><input id="name" name="name" required>
  <label for="email">Email *</label><input id="email" name="email" type="email" required>
  <label for="start">Earliest start date *</label><input id="start" name="start" type="date" required>
  <button type="submit">Submit application</button>
</form>
<div id="received" hidden><h2></h2><pre></pre></div>
<script src="_done.js"></script>
<script>
document.getElementById("date_form").addEventListener("submit", (e) => {
  e.preventDefault();
  labShow(Object.fromEntries(new FormData(e.target)), "Thank you for applying!");
});
</script>
</body>
</html>
