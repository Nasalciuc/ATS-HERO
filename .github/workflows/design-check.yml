name: Figma design check
# Opens each spec'd screen at its Figma frame size and compares element boxes (±2px) and computed
# styles with the Figma geometry (apps/web/design-check). A "locked" screen that drifts blocks the PR.
# The screenshot / pixel diff / overlay against the Figma export are uploaded for humans.
on:
  pull_request:
    paths:
      - "apps/web/app/**"
      - "apps/web/components/**"
      - "apps/web/views/**"
      - "apps/web/public/fonts/**"
      - "apps/web/design-check/**"
      - "reference/figma/**"
      - ".github/workflows/design-check.yml"
  workflow_dispatch:

jobs:
  figma:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: atshero }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Throwaway CI database (service container above) — not a secret.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/atshero
      NEXT_TELEMETRY_DISABLED: "1"
    defaults: { run: { working-directory: apps/web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run db:migrate
      # Dev server, not `next start`: a production bundle refuses to boot without the Clerk
      # publishable key (app/providers.tsx), and CI has no Clerk keys. Same CSS either way.
      - name: Start the app (guest mode)
        run: |
          npx next dev -p 3000 > /tmp/next.log 2>&1 &
          for i in $(seq 1 120); do curl -sf -o /dev/null http://localhost:3000/app/create && exit 0; sleep 1; done
          cat /tmp/next.log; exit 1
      - name: Spec-check against Figma (gate)
        run: npm run design:check
      - name: Report → job summary
        if: always()
        run: cat design-check/out/REPORT.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: figma-design-check, path: apps/web/design-check/out/ }
