name: Migration drift check
on: { pull_request: { paths: ["apps/web/db/schema.ts", "apps/web/drizzle/**"] } }
jobs:
  drift:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: npm ci
      - run: npx drizzle-kit generate
      - run: git diff --exit-code drizzle/ || (echo "Schema changed without committed migration" && exit 1)
