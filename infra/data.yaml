AWSTemplateFormatVersion: "2010-09-09"
Description: >
  ATS Hero - data stack (atshero-data): the RDS Postgres instance that is the system of record,
  and the bucket its dumps go to. One instance holds two databases: atshero (production) and
  atshero_dev (Vercel previews), each with its own login role. Stateful: deployed by a human only
  (CI can't touch this stack), snapshot on delete/replace, deletion protection, and a stack policy
  that refuses to replace or delete the instance. If the instance was created by hand (U0),
  IMPORT it into this stack, don't recreate it.

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: The default VPC is fine (no NAT, no private subnets needed)
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: At least two subnets in different AZs of that VPC
  InstanceClass:
    Type: String
    Default: db.t4g.micro
  EngineVersion:
    Type: String
    Default: "16"
    Description: >
      Major version only: RDS picks the current 16.x and AutoMinorVersionUpgrade keeps it current,
      so a pinned minor would only drift. Matches local Docker (postgres:16).
  MasterPasswordMode:
    Type: String
    AllowedValues: [managed, existing]
    Default: managed
    Description: >
      managed = new instance, RDS keeps the master password in Secrets Manager.
      existing = an imported instance keeps the password it already has (switching would rotate it).

Conditions:
  ManagedPassword: !Equals [!Ref MasterPasswordMode, managed]

Resources:
  DbSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: atshero
      SubnetIds: !Ref SubnetIds
      Tags: [{ Key: project, Value: atshero }]

  # Vercel functions have no fixed IPs, so 5432 is open; TLS is forced and logins are
  # password- or IAM-token-based. Trigger to close it: Vercel static IPs or a private network.
  DbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: atshero Postgres (TLS only)
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          CidrIp: 0.0.0.0/0
      Tags: [{ Key: project, Value: atshero }]

  DbParameterGroup:
    Type: AWS::RDS::DBParameterGroup
    Properties:
      Family: postgres16
      Description: atshero - TLS forced, slow queries logged
      Parameters:
        rds.force_ssl: "1"
        log_min_duration_statement: "1000"
        # The privacy page promises that our logs never hold what a CV says: slow statements are
        # logged without their bind values, and errors without DETAIL (where Postgres puts the
        # failing row). Both apply without a reboot.
        log_parameter_max_length: "0"
        log_error_verbosity: terse
      Tags: [{ Key: project, Value: atshero }]

  Database:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      DBInstanceIdentifier: atshero
      Engine: postgres
      EngineVersion: !Ref EngineVersion
      AutoMinorVersionUpgrade: true
      DBInstanceClass: !Ref InstanceClass
      AllocatedStorage: "20"
      MaxAllocatedStorage: 50
      StorageType: gp3
      StorageEncrypted: true
      MultiAZ: false
      PubliclyAccessible: true
      DBSubnetGroupName: !Ref DbSubnetGroup
      VPCSecurityGroups: [!GetAtt DbSecurityGroup.GroupId]
      DBParameterGroupName: !Ref DbParameterGroup
      DBName: atshero
      MasterUsername: postgres
      ManageMasterUserPassword: !If [ManagedPassword, true, !Ref AWS::NoValue]
      EnableIAMDatabaseAuthentication: true
      # Daily snapshot + point-in-time restore to any minute of the last 14 days (logs are shipped
      # every 5 minutes). Backup storage up to the size of the database (20 GB) costs nothing.
      BackupRetentionPeriod: 14
      PreferredBackupWindow: "03:00-04:00"
      CopyTagsToSnapshot: true
      DeletionProtection: true
      Tags: [{ Key: project, Value: atshero }]

  # Monthly pg_dump goes here (F5): a copy outside RDS. Kept 180 days, then 30 more as a
  # noncurrent version (GDPR storage limitation: a deleted account's data leaves these copies
  # within 7 months). The F5 commit changes the backup lines of the privacy page
  # (apps/web/views/PrivacyPage.tsx), which until then promise 14 days and 30 days.
  # Kept if the stack is deleted.
  BackupsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub atshero-backups-${AWS::AccountId}
      VersioningConfiguration: { Status: Enabled }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      LifecycleConfiguration:
        Rules:
          - Id: cold-after-30-days
            Status: Enabled
            Transitions:
              - { StorageClass: GLACIER_IR, TransitionInDays: 30 }
            ExpirationInDays: 180
            NoncurrentVersionExpiration: { NoncurrentDays: 30 }
      Tags: [{ Key: project, Value: atshero }]

  # Pre-registered triggers: connections > 60 -> InstanceClass db.t4g.small (twice the memory, so
  # twice the connections; RDS Proxy can't be public, so Vercel could not reach it);
  # disk < 4 GB; CPU > 80 % for 15 min.
  ConnectionsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: atshero-db-connections
      Namespace: AWS/RDS
      MetricName: DatabaseConnections
      Dimensions: [{ Name: DBInstanceIdentifier, Value: !Ref Database }]
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 60
      ComparisonOperator: GreaterThanThreshold
      AlarmActions: [!ImportValue atshero-alerts-topic-arn]

  FreeStorageAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: atshero-db-free-storage
      Namespace: AWS/RDS
      MetricName: FreeStorageSpace
      Dimensions: [{ Name: DBInstanceIdentifier, Value: !Ref Database }]
      Statistic: Minimum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 4294967296
      ComparisonOperator: LessThanThreshold
      AlarmActions: [!ImportValue atshero-alerts-topic-arn]

  CpuAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: atshero-db-cpu
      Namespace: AWS/RDS
      MetricName: CPUUtilization
      Dimensions: [{ Name: DBInstanceIdentifier, Value: !Ref Database }]
      Statistic: Average
      Period: 300
      EvaluationPeriods: 3
      Threshold: 80
      ComparisonOperator: GreaterThanThreshold
      AlarmActions: [!ImportValue atshero-alerts-topic-arn]

  # The privacy page promises that the copy taken before a database update is gone within 30 days
  # (tests/privacy-page.test.tsx holds KEEP_DAYS to it). Manual snapshots never expire on their own,
  # so this job runs every day and deletes those of this instance once they are 28 days old: gone by
  # day 29, or by day 30 if a run fails. It may delete only snapshots tagged project=atshero, which
  # the instance copies to its snapshots unless one is given tags of its own. A snapshot old enough
  # that it can't delete fails the run, and the alarm below e-mails a human. The automated daily
  # snapshots expire through BackupRetentionPeriod. The job lives in this stack: if the stack is
  # ever deleted, the final snapshot it leaves behind has to be deleted by hand.
  SnapshotCleanupLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/atshero-snapshot-cleanup
      RetentionInDays: 30
      Tags: [{ Key: project, Value: atshero }]

  # No permissions boundary: the boundary caps the roles CI creates in the app stacks, and this
  # stack is deployed by a human only. The policy is the ceiling: list the snapshots, delete only
  # those tagged project=atshero, write its own logs.
  SnapshotCleanupRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: delete-old-manual-snapshots
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: rds:DescribeDBSnapshots
                Resource: "*"
              - Effect: Allow
                Action: rds:DeleteDBSnapshot
                Resource: !Sub arn:${AWS::Partition}:rds:${AWS::Region}:${AWS::AccountId}:snapshot:*
                Condition:
                  StringEquals: { "rds:snapshot-tag/project": atshero }
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt SnapshotCleanupLogs.Arn
      Tags: [{ Key: project, Value: atshero }]

  SnapshotCleanup:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: atshero-snapshot-cleanup
      Description: Deletes the manual snapshots of the atshero instance once they are 28 days old
      Runtime: python3.12
      Architectures: [arm64]
      Handler: index.handler
      MemorySize: 128
      Timeout: 60
      Role: !GetAtt SnapshotCleanupRole.Arn
      Environment:
        Variables:
          DB_INSTANCE: !Ref Database
          KEEP_DAYS: "28"
      Code:
        ZipFile: |
          import datetime
          import os

          import boto3
          from botocore.exceptions import ClientError

          rds = boto3.client("rds")


          def handler(event, context):
              keep = datetime.timedelta(days=int(os.environ["KEEP_DAYS"]))
              cutoff = datetime.datetime.now(datetime.timezone.utc) - keep
              deleted, kept, stuck = [], [], []
              pages = rds.get_paginator("describe_db_snapshots").paginate(
                  DBInstanceIdentifier=os.environ["DB_INSTANCE"], SnapshotType="manual"
              )
              for page in pages:
                  for snap in page["DBSnapshots"]:
                      name, status = snap["DBSnapshotIdentifier"], snap.get("Status")
                      created = snap.get("SnapshotCreateTime")
                      # too young, still being made, or already going (a retry of this run)
                      if created is None or created > cutoff or status == "deleting":
                          kept.append(name)
                          continue
                      tags = {t["Key"]: t.get("Value") for t in snap.get("TagList", [])}
                      if status != "available" or tags.get("project") != "atshero":
                          stuck.append(f"{name} (status {status}, project={tags.get('project')})")
                          continue
                      try:
                          rds.delete_db_snapshot(DBSnapshotIdentifier=name)
                          deleted.append(name)
                      except ClientError as err:
                          stuck.append(f"{name} ({err.response['Error']['Code']})")
              print({"cutoff": cutoff.isoformat(), "deleted": deleted, "kept": kept, "stuck": stuck})
              if stuck:
                  # Old enough to go, but this job can't delete them: the alarm sends a human.
                  raise RuntimeError(f"manual snapshots older than {keep.days} days left: {stuck}")
              return {"deleted": deleted, "kept": len(kept)}
      Tags: [{ Key: project, Value: atshero }]

  # Every day at 04:30 UTC, after the 03:00-04:00 backup window.
  SnapshotCleanupSchedule:
    Type: AWS::Events::Rule
    Properties:
      Description: Daily run of atshero-snapshot-cleanup
      ScheduleExpression: cron(30 4 * * ? *)
      Targets:
        - Id: snapshot-cleanup
          Arn: !GetAtt SnapshotCleanup.Arn
      Tags: [{ Key: project, Value: atshero }]

  SnapshotCleanupInvoke:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref SnapshotCleanup
      Principal: events.amazonaws.com
      SourceArn: !GetAtt SnapshotCleanupSchedule.Arn

  SnapshotCleanupAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: atshero-snapshot-cleanup-errors
      AlarmDescription: The daily snapshot cleanup failed, so a promise on the privacy page may be broken
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions: [{ Name: FunctionName, Value: !Ref SnapshotCleanup }]
      Statistic: Sum
      Period: 3600
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!ImportValue atshero-alerts-topic-arn]
      Tags: [{ Key: project, Value: atshero }]

Outputs:
  Endpoint:
    Value: !GetAtt Database.Endpoint.Address
  Port:
    Value: !GetAtt Database.Endpoint.Port
  DbiResourceId:
    Description: DbResourceId for the app stack (IAM database login)
    Value: !GetAtt Database.DbiResourceId
  MasterSecretArn:
    Condition: ManagedPassword
    Description: >
      RDS rotates this password every 7 days: read it from Secrets Manager each time you need it
      (migrations), straight into PGPASSWORD - never into chat, files or shell history
    Value: !GetAtt Database.MasterUserSecret.SecretArn
  BackupsBucketName:
    Value: !Ref BackupsBucket
  # for the restore drill (F5): a restored copy must use the same network and parameters
  DbSubnetGroupName:
    Value: !Ref DbSubnetGroup
  DbSecurityGroupId:
    Value: !GetAtt DbSecurityGroup.GroupId
  DbParameterGroupName:
    Value: !Ref DbParameterGroup
